# Keyper Performance Test Configuration
# Modify these values to customize test behavior

# Network Configuration
BASE_HTTP_PORT=8080
BASE_RAFT_PORT=9080
MAX_NODES=10

# Test Duration Settings (in seconds)
STABILITY_DURATION=300        # 5 minutes for stability tests
TEST_TIMEOUT=30              # General test timeout
MONITORING_INTERVAL=10       # How often to sample metrics

# Performance Thresholds
MEMORY_LIMIT_MB=100          # Maximum memory per node
STARTUP_TIME_LIMIT=3         # Maximum startup time in seconds
MIN_THROUGHPUT_SEQUENTIAL=100 # Minimum requests/sec for sequential tests
MIN_THROUGHPUT_CONCURRENT=200 # Minimum requests/sec for concurrent tests

# Load Test Configuration
CONCURRENT_CLIENTS=5         # Number of concurrent test clients
REQUESTS_PER_CLIENT=100      # Requests per client in throughput tests
RESTART_CYCLES=5             # Number of restart cycles for port reuse tests

# Test Selection (set to 1 to enable, 0 to disable)
ENABLE_STARTUP_TESTS=1
ENABLE_MEMORY_TESTS=1
ENABLE_SCALABILITY_TESTS=1
ENABLE_THROUGHPUT_TESTS=1
ENABLE_STABILITY_TESTS=1
ENABLE_PORT_REUSE_TESTS=1

# Reporting Configuration
GENERATE_DETAILED_REPORT=1
KEEP_TEST_LOGS=0             # Set to 1 to keep individual test logs
REPORT_FORMAT="txt"          # Future: support for json, html formats

# Advanced Settings
ALLOW_ROOT_EXECUTION=0       # Set to 1 to allow running as root (not recommended)
SKIP_PREREQUISITE_CHECK=0    # Set to 1 to skip system checks (dangerous)
PARALLEL_TEST_EXECUTION=0    # Future: support for parallel test execution
